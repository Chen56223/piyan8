<style>
:root{--blue:#2563eb;--pale:#eff6ff;--ink:#1f2937;--muted:#64748b;--line:#e5eaf1;--paper:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font:16px/1.75 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#fff}
a{color:inherit;text-decoration:none}button,input{font:inherit}.wrap{width:min(1100px,calc(100% - 44px));margin:auto}
header{height:76px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#ffffffed;backdrop-filter:blur(12px);z-index:5}
.nav{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center;font-weight:850;font-size:20px;letter-spacing:-.5px}.mark{width:39px;height:39px;border-radius:12px;background:var(--blue);color:white;display:grid;place-items:center}.brand small{display:block;font-size:10px;letter-spacing:0;color:var(--muted);font-weight:500;margin-top:-3px}
nav{display:flex;gap:28px;color:#475569;font-size:14px}nav a:hover,nav a.active{color:var(--blue)}
.hero{padding:84px 0 75px;background:linear-gradient(180deg,#f7faff,#fff)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--blue)}
h1{font-size:clamp(38px,6vw,60px);line-height:1.2;letter-spacing:-1.8px;margin:17px 0;max-width:740px}.hero h1 span{color:var(--blue)}.hero p{color:var(--muted);font-size:17px;max-width:630px;margin:0}
.actions{display:flex;gap:12px;margin-top:30px}.btn{border:0;border-radius:10px;padding:11px 19px;background:var(--blue);color:white;font-weight:700;cursor:pointer;display:inline-flex}.btn.alt{background:white;color:#334155;border:1px solid var(--line)}
section.block{padding:58px 0}.soft{background:#f8fafc}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.head h2{font-size:28px;letter-spacing:-.5px;margin:0}.head p{margin:5px 0 0;color:var(--muted);font-size:14px}
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.cat{padding:22px;border:1px solid var(--line);border-radius:16px;background:white;transition:.2s;cursor:pointer}.cat:hover,.article:hover{transform:translateY(-3px);border-color:#b9d0ff;box-shadow:0 12px 30px #1e40af0d}.ico{width:43px;height:43px;border-radius:12px;background:var(--pale);display:grid;place-items:center;color:var(--blue);font-size:21px}.cat h3{font-size:17px;margin:13px 0 3px}.cat p{font-size:13px;color:var(--muted);margin:0}
.articles{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.article{border:1px solid var(--line);border-radius:15px;background:white;transition:.2s;cursor:pointer}.article-inner{padding:21px}.tag{font-size:12px;font-weight:750;color:var(--blue)}.article h3{font-size:18px;line-height:1.45;margin:9px 0}.article p{font-size:14px;color:var(--muted);margin:0 0 18px}.meta{display:flex;justify-content:space-between;color:#94a3b8;font-size:12px}.meta b{color:var(--blue)}
.page{padding:54px 0 70px;min-height:65vh}.page h1{font-size:36px;margin:8px 0}.sub{color:var(--muted);margin:0 0 25px}.search{width:min(650px,100%);padding:14px 17px;border:1px solid #cbd5e1;border-radius:11px;outline:none}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2563eb18}
.article-body{max-width:780px}.article-body h1{font-size:38px}.article-body h2{font-size:25px;margin-top:35px;border-bottom:1px solid var(--line);padding-bottom:8px}.article-body p,.article-body li{line-height:1.95}.article-body blockquote{border-left:3px solid var(--blue);background:#f8fbff;padding:10px 18px;margin:22px 0;color:#475569}.article-body pre{background:#0f172a;color:#e2e8f0;border-radius:12px;padding:18px;overflow:auto}.back{color:var(--blue);font-size:14px;font-weight:700;cursor:pointer}
.empty{padding:30px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted);grid-column:1/-1}
footer{background:#f8fafc;border-top:1px solid var(--line);padding:32px 0;color:var(--muted);font-size:13px}footer strong{color:var(--blue);font-size:17px}
@media(max-width:800px){.categories{grid-template-columns:repeat(2,1fr)}.articles{grid-template-columns:repeat(2,1fr)}nav{gap:14px}}
@media(max-width:560px){header{height:auto}.nav{padding:11px 0;align-items:flex-start;flex-direction:column;gap:8px}nav{width:100%;justify-content:space-between;font-size:13px}.hero{padding:57px 0}.hero h1{font-size:39px}.categories,.articles{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column;gap:8px}.actions{flex-wrap:wrap}.page h1,.article-body h1{font-size:30px}}
</style>

<body>
<header><div class="wrap nav"><a class="brand" href="#home"><span class="mark">U</span><span>UniNotes<small>大學生數位學習筆記</small></span></a><nav><a href="#home">首頁</a><a href="#categories">知識分類</a><a href="#search">搜尋文章</a><a href="#about">關於</a></nav></div></header>
<main id="app"></main>
<footer><div class="wrap"><strong>UniNotes</strong><div>把知識整理好，讓每一次學習都更有方向。</div><small>© <span id="year"></span> UniNotes · 用心整理，持續更新</small></div></footer>
<script>
const cats=[
{name:"AI 工具",slug:"ai",icon:"✦",desc:"善用生成式 AI，提升學習與創作效率。"},
{name:"科技知識",slug:"tech",icon:"⌘",desc:"用容易理解的方式認識網路、程式與資訊科技。"},
{name:"數位工具",slug:"digital",icon:"▧",desc:"筆記、文件、協作與日常生產力工具教學。"},
{name:"學習技巧",slug:"study",icon:"↗",desc:"建立有效的讀書方法、時間管理與整理習慣。"}
];
const posts=[
{id:"chatgpt-study",cat:"AI 工具",title:"用 ChatGPT 輔助學習的 5 個實用方法",desc:"從概念解釋到練習測驗，學會把 AI 當成學習夥伴，而不是直接代替思考。",tags:["ChatGPT","AI 學習","提示詞"],date:"2026-11-07",body:`<p>生成式 AI 可以成為隨時能提問的學習夥伴。關鍵不是請它直接給答案，而是讓它協助你理解、練習與檢查自己的想法。</p><h2>1. 請 AI 用不同方式解釋概念</h2><p>遇到抽象概念時，可以要求 AI 使用生活化比喻、簡單例子，或先講直覺再補充正式定義。</p><h2>2. 把長內容整理成架構</h2><p>貼上課堂筆記後，請它整理出核心概念、彼此關係與仍需釐清的問題。整理後仍要回到教材確認正確性。</p><h2>3. 產生練習題與提示</h2><p>請 AI 依照課程範圍出題，先只給提示，不要直接揭露答案。完成後再請它解釋錯誤原因。</p><h2>4. 模擬口頭問答</h2><p>請 AI 扮演老師，一次問一題，根據你的回答追問。這能幫助你練習主動提取知識。</p><h2>5. 檢查自己的理解</h2><p>先自己寫出解題過程或概念摘要，再請 AI 找出跳步、矛盾或可能的誤解。</p><h2>好用的提示詞範例</h2><pre>請扮演耐心的家教，協助我理解「＿＿」。\n先用生活化例子解釋，再給正式定義。\n每次只問我一個問題，確認我理解後再進入下一步。</pre><h2>使用 AI 時的注意事項</h2><p>AI 可能產生看似合理但不正確的內容。涉及數據、引用、法規或重要作業時，請以課程教材與可靠來源交叉查證，也不要輸入個人敏感資料。</p><h2>小結</h2><p>把 AI 當成解釋者、出題者與回饋者，保留自己思考與驗證的責任，才能真正提升學習效果。</p>`},
{id:"digital-notes",cat:"數位工具",title:"建立不容易失控的數位筆記系統",desc:"用簡單一致的分類、命名與回顧流程，讓筆記真正找得到、用得上。",tags:["數位筆記","資訊整理","效率"],date:"2026-11-07",body:`<p>筆記工具不是越複雜越好。好的系統應該讓記錄快速、搜尋容易，而且能在需要時重新使用。</p><h2>先決定筆記要解決什麼問題</h2><p>常見用途包含課堂紀錄、閱讀摘要、專題資料與個人待辦。先列出自己的主要情境，再決定資料夾與標籤。</p><h2>使用少量且穩定的分類</h2><p>可以先用課程、專案、生活三個大方向。分類太細會增加整理成本，暫時不知道放哪裡的內容，可以先進入收件匣。</p><h2>設計一致的命名方式</h2><p>例如使用「日期－課程－主題」命名課堂筆記。標題應該讓未來的自己不打開檔案也能猜到內容。</p><h2>每週安排一次回顧</h2><p>每週花十分鐘處理收件匣、補上關鍵字、刪除重複內容，並把重要知識連結到相關筆記。</p><h2>小結</h2><p>先建立簡單、能持續的流程，再依實際需求調整工具。系統的價值在於能幫助你思考，而不是花時間維護系統本身。</p>`},
{id:"internet-basics",cat:"科技知識",title:"網址、網域與 DNS 是什麼？",desc:"從瀏覽器輸入網址開始，理解網域名稱如何透過 DNS 找到網站伺服器。",tags:["網路","DNS","入門"],date:"2026-11-07",body:`<p>每天打開網站都會使用網址，但網址、網域名稱與 DNS 各自扮演不同角色。</p><h2>網址包含哪些資訊？</h2><p>網址（URL）通常包含通訊協定、網域名稱、路徑與可選的查詢參數。例如 <code>https://example.com/articles?id=1</code> 中，HTTPS 是協定、example.com 是網域、/articles 是路徑。</p><h2>網域名稱是什麼？</h2><p>網域名稱是方便人閱讀與記憶的網站名稱。網路設備實際傳輸資料時，會使用 IP 位址定位主機。</p><h2>DNS 如何運作？</h2><p>DNS（網域名稱系統）像網路電話簿，負責查詢網域對應的 IP 位址。瀏覽器需要連線時，會透過 DNS 解析取得可用的位址，再向伺服器發出請求。</p><h2>為什麼設定有時不會立即生效？</h2><p>DNS 記錄可能被不同層級快取，因此更新後不一定立即在所有網路環境同步。等待快取更新，或檢查記錄是否設定正確，通常是排查方向。</p><h2>小結</h2><p>網址是資源的位置表示，網域是容易記憶的名稱，而 DNS 負責把名稱解析成網路可使用的位址。</p>`},
{id:"study-method",cat:"學習技巧",title:"用主動回想提升讀書效率",desc:"理解主動回想與間隔複習的概念，將閱讀時間轉化為真正記得住的知識。",tags:["讀書方法","記憶","複習"],date:"2026-11-07",body:`<p>反覆閱讀會讓內容看起來熟悉，但熟悉不一定代表真的記得。主動回想是先合上教材，再嘗試從記憶中提取重點。</p><h2>什麼是主動回想？</h2><p>讀完一小節後，闔上書本，試著寫下核心概念、公式或步驟。接著打開教材比對，找出遺漏與錯誤。</p><h2>搭配間隔複習</h2><p>不要只在考前一次讀完。可以在學習當天、隔天、數天後與一週後安排短時間回想，依記憶狀況調整間隔。</p><h2>一個簡單的練習流程</h2><ol><li>閱讀一個小段落，理解主要概念。</li><li>闔上教材，用自己的話寫出重點。</li><li>對照教材，標記想不起來或理解錯誤的地方。</li><li>隔一段時間再測試一次，不只重看答案。</li></ol><h2>常見錯誤</h2><p>只抄寫漂亮筆記、看著答案覺得自己會了，或一次安排太多複習內容，都容易讓練習失去效果。重點是先嘗試回想，再用教材校正。</p><h2>小結</h2><p>把「讀過」改成「能不能不看資料說出來」，能更清楚掌握自己的學習狀態。</p>`}
];
const app=document.querySelector("#app");document.querySelector("#year").textContent=new Date().getFullYear();
const card=p=>`<article class="article" data-id="${p.id}"><div class="article-inner"><span class="tag">${p.cat}</span><h3>${p.title}</h3><p>${p.desc}</p><div class="meta"><span>${p.date}</span><b>閱讀文章 →</b></div></div></article>`;
function home(){app.innerHTML=`<section class="hero"><div class="wrap"><span class="eyebrow">LEARN · ORGANIZE · GROW</span><h1>把複雜的知識，<br><span>整理成自己的力量。</span></h1><p>為大學生打造的數位學習筆記。從 AI 工具、科技知識到學習方法，找到值得收藏的知識與靈感。</p><div class="actions"><a class="btn" href="#categories">探索知識分類 →</a><a class="btn alt" href="#search">搜尋文章</a></div></div></section><section class="block"><div class="wrap"><div class="head"><div><span class="eyebrow">EXPLORE TOPICS</span><h2>探索知識分類</h2><p>從你感興趣的主題開始，建立自己的知識地圖。</p></div></div><div class="categories">${cats.map(c=>`<a class="cat" href="#category/${c.slug}"><span class="ico">${c.icon}</span><h3>${c.name}</h3><p>${c.desc}</p></a>`).join("")}</div></div></section><section class="block soft"><div class="wrap"><div class="head"><div><span class="eyebrow">LATEST NOTES</span><h2>最新文章</h2><p>持續更新，讓每一次閱讀都有收穫。</p></div><a class="back" href="#search">搜尋全部文章 →</a></div><div class="articles">${posts.map(card).join("")}</div></div></section>`}
function category(slug){const c=cats.find(x=>x.slug===slug);if(!c)return home();const list=posts.filter(p=>p.cat===c.name);app.innerHTML=`<section class="page wrap"><span class="eyebrow">CATEGORY</span><h1>${c.name}</h1><p class="sub">${c.desc}</p><div class="articles">${list.length?list.map(card).join(""):'<div class="empty">這個分類的文章正在準備中，敬請期待！</div>'}</div><p style="margin-top:30px"><a class="back" href="#categories">← 所有分類</a></p></section>`}
function categories(){app.innerHTML=`<section class="page wrap"><span class="eyebrow">CATEGORIES</span><h1>知識分類</h1><p class="sub">依照主題探索文章，找到現在最需要的知識。</p><div class="categories">${cats.map(c=>`<a class="cat" href="#category/${c.slug}"><span class="ico">${c.icon}</span><h3>${c.name}</h3><p>${c.desc}</p><p style="margin-top:12px">${posts.filter(p=>p.cat===c.name).length} 篇文章 →</p></a>`).join("")}</div></section>`}
function search(){app.innerHTML=`<section class="page wrap"><span class="eyebrow">SEARCH</span><h1>搜尋知識</h1><p class="sub">輸入關鍵字，尋找文章標題、摘要或標籤。</p><input id="q" class="search" type="search" placeholder="例如：ChatGPT、筆記方法、網路安全…"><p id="count" class="sub" style="margin:12px 0"></p><div id="results" class="articles"></div></section>`;const q=document.querySelector("#q");const render=()=>{const v=q.value.trim().toLowerCase();const found=posts.filter(p=>[p.title,p.desc,p.cat,...p.tags].join(" ").toLowerCase().includes(v));document.querySelector("#count").textContent=v?`找到 ${found.length} 篇文章`:`目前收錄 ${found.length} 篇文章`;document.querySelector("#results").innerHTML=found.length?found.map(card).join(""):'<div class="empty">找不到符合的文章，試試其他關鍵字。</div>';};q.addEventListener("input",render);render()}
function article(id){const p=posts.find(x=>x.id===id);if(!p)return home();app.innerHTML=`<section class="page wrap"><div class="article-body"><a class="back" href="#category/${cats.find(c=>c.name===p.cat).slug}">← ${p.cat}</a><h1>${p.title}</h1><p class="sub">${p.desc}</p><div class="meta"><span>${p.date}</span><span>UniNotes 編輯整理</span></div><p>${p.tags.map(t=>`<span class="tag" style="margin-right:8px">#${t}</span>`).join("")}</p>${p.body}<p style="margin-top:38px"><a class="back" href="#home">← 回到首頁</a></p></div></section>`}
function about(){app.innerHTML=`<section class="page wrap"><span class="eyebrow">ABOUT UNINOTES</span><h1>讓知識成為日常的一部分。</h1><p class="sub">一個持續整理、持續成長的數位學習知識庫。</p><div class="article-body"><h2>關於 UniNotes</h2><p>UniNotes 是為大學生打造的繁體中文數位學習筆記，將分散的工具資訊與學習方法整理成容易理解、方便查找的內容。</p><h2>四大主題</h2><ul><li><b>AI 工具：</b>生成式 AI、提示詞與 AI 學習應用。</li><li><b>科技知識：</b>網路、API、程式與資訊安全入門。</li><li><b>數位工具：</b>筆記、協作、文件與生產力工具。</li><li><b>學習技巧：</b>讀書方法、時間管理與資訊整理。</li></ul><h2>持續更新</h2><p>希望每位讀者都能在這裡找到實用的方法，建立自己的學習系統。</p></div></section>`}
function route(){const h=location.hash.slice(1);if(!h||h==="home")home();else if(h==="categories")categories();else if(h==="search")search();else if(h==="about")about();else if(h.startsWith("category/"))category(h.split("/")[1]);else if(h.startsWith("article/"))article(h.split("/")[1]);else home();window.scrollTo(0,0)}
document.addEventListener("click",e=>{const el=e.target.closest(".article");if(el){location.hash="article/"+el.dataset.id}});
window.addEventListener("hashchange",route);route();
</script>
</body></html>
